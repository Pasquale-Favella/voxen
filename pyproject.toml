[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxen"
version = "0.1.8"
description = "Local-first AI voice dictation for Windows and macOS"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "faster-whisper>=1.1.0,<2",
    "pynput>=1.7.7,<2",
    "numpy>=1.26.0,<3",
    "sounddevice>=0.4.7,<1",
    "pyautogui>=0.9.54,<1",
    "pyperclip>=1.9.0,<2",
    "pystray>=0.19.5,<1",
    "Pillow>=10.0.0,<13",
    "pyobjc-framework-Cocoa>=10.0,<13; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<10", "pyinstaller>=6.0,<7", "resvg-py>=0.5.0,<1", "ruff>=0.6.0,<1"]

[project.scripts]
voxen = "voxen.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
