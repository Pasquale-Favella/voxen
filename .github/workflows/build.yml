name: Build Voxen

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Run tests (including real Tk widgets)
        run: xvfb-run -a python -m pytest -q

  parakeet-integration:
    name: Real Parakeet inference (CPU)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Generate deterministic speech fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng
          espeak-ng -v en-us -s 140 -w /tmp/voxen-source.wav "Hello world. This is a local speech recognition test."
          python - <<'PY'
          import wave
          import numpy as np
          with wave.open('/tmp/voxen-source.wav', 'rb') as f:
              rate = f.getframerate()
              audio = np.frombuffer(f.readframes(f.getnframes()), dtype='<i2')
          resampled = np.interp(np.arange(round(len(audio) * 16000 / rate)) * rate / 16000, np.arange(len(audio)), audio)
          with wave.open('/tmp/voxen-smoke.wav', 'wb') as f:
              f.setparams((1, 2, 16000, 0, 'NONE', 'not compressed'))
              f.writeframes(resampled.astype('<i2').tobytes())
          PY
      - name: Verify pinned weights, VAD and offline reload
        env:
          VOXEN_PARAKEET_TEST_WAV: /tmp/voxen-smoke.wav
          VOXEN_PARAKEET_TEST_EXPECTED: hello world
        run: python -m pytest tests/test_parakeet_integration.py -q -rs

  package:
    name: Package (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release_version.py
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Run tests
        run: python -m pytest -q
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Build application
        run: python scripts/build.py
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Voxen-${{ matrix.os }}
          path: |
            dist/installer/*.exe
            dist/Voxen-windows.zip
            dist/Voxen-macos.dmg
          if-no-files-found: error

  package-linux:
    name: Package Linux x86-64 (X11)
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux build and runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libportaudio2 libasound2 libx11-6 libxtst6 libxext6 libxrender1 libxi6 libxkbcommon0 xclip xvfb xauth libglib2.0-bin file desktop-file-utils squashfs-tools
          python -m pip install -e ".[dev]"
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release_version.py
      - name: Test X11 input and clipboard
        run: xvfb-run -a env XDG_SESSION_TYPE=x11 VOXEN_X11_SMOKE=1 python -m pytest tests/test_linux_x11.py -q
      - name: Fetch pinned AppImage packaging tool
        run: |
          curl --fail --location --retry 3 https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o "$RUNNER_TEMP/appimagetool"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      - name: Build Linux packages
        run: python scripts/build.py
      - name: Smoke-test installed Debian package and AppImage
        run: |
          sudo apt-get install -y ./dist/voxen_*_amd64.deb
          xvfb-run -a env XDG_SESSION_TYPE=x11 voxen --check-runtime
          xvfb-run -a env XDG_SESSION_TYPE=x11 APPIMAGE_EXTRACT_AND_RUN=1 ./dist/Voxen-*-x86_64.AppImage --check-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: Voxen-linux-x86_64
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  release:
    name: Attest and publish installers
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, package-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: Voxen-*
          path: release-assets
          merge-multiple: false
      - name: Stage final release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-dist
          version="${GITHUB_REF_NAME#v}"
          for name in "Voxen-Setup-$version.exe" "Voxen-macos.dmg" "voxen_${version}_amd64.deb" "Voxen-$version-x86_64.AppImage"; do
            mapfile -d '' files < <(find release-assets -type f -name "$name" -print0)
            if [[ ${#files[@]} -ne 1 ]]; then
              echo "Expected exactly one $name, found ${#files[@]}" >&2
              exit 1
            fi
            test -s "${files[0]}"
            cp -- "${files[0]}" "release-dist/$name"
          done
          # A portable Windows ZIP is optional, but never replaces the installer.
          mapfile -d '' zips < <(find release-assets -type f -name 'Voxen-windows.zip' -print0)
          if [[ ${#zips[@]} -gt 1 ]]; then
            echo "Duplicate portable Windows ZIP" >&2
            exit 1
          elif [[ ${#zips[@]} -eq 1 ]]; then
            test -s "${zips[0]}"
            cp -- "${zips[0]}" release-dist/
          fi
          cd release-dist
          LC_ALL=C sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          sha256sum --check SHA256SUMS
      - name: Sign build provenance using GitHub OIDC and Sigstore
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'release-dist/*'
      - name: Verify signed provenance before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for asset in release-dist/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" --source-ref "$GITHUB_REF"
          done
      - name: Publish attested release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Publish new releases only after all four installers, their digests
          # and signed provenance are available. Do not silently replace
          # the binaries of an existing public release.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [[ "$draft" != true ]]; then
              echo "Release is already public; create a new version instead of replacing attested assets." >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Voxen $GITHUB_REF_NAME" --generate-notes --draft
          fi
          gh release upload "$GITHUB_REF_NAME" release-dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
