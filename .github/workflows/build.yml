name: Build Voxen

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Build application
        run: python scripts/build.py
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Voxen-${{ matrix.os }}
          path: |
            dist/installer/*.exe
            dist/Voxen-windows.zip
            dist/Voxen-macos.dmg
          if-no-files-found: error

  release:
    name: Attach installers to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: Voxen-*
          path: release-assets
          merge-multiple: true
      - name: Upload installers to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r -d '' asset; do
            gh release upload "${GITHUB_REF_NAME}" "$asset" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          done < <(find release-assets -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' \) -print0)
