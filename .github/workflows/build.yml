name: Build Voxen

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Run tests (including real Tk widgets)
        run: xvfb-run -a python -m pytest -q

  parakeet-integration:
    name: Real Parakeet inference (CPU)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Generate deterministic speech fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng
          espeak-ng -v en-us -s 140 -w /tmp/voxen-source.wav "Hello world. This is a local speech recognition test."
          python - <<'PY'
          import wave
          import numpy as np
          with wave.open('/tmp/voxen-source.wav', 'rb') as f:
              rate = f.getframerate()
              audio = np.frombuffer(f.readframes(f.getnframes()), dtype='<i2')
          resampled = np.interp(np.arange(round(len(audio) * 16000 / rate)) * rate / 16000, np.arange(len(audio)), audio)
          with wave.open('/tmp/voxen-smoke.wav', 'wb') as f:
              f.setparams((1, 2, 16000, 0, 'NONE', 'not compressed'))
              f.writeframes(resampled.astype('<i2').tobytes())
          PY
      - name: Verify pinned weights, VAD and offline reload
        env:
          VOXEN_PARAKEET_TEST_WAV: /tmp/voxen-smoke.wav
          VOXEN_PARAKEET_TEST_EXPECTED: hello world
        run: python -m pytest tests/test_parakeet_integration.py -q -rs

  package:
    name: Package (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release_version.py
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Run tests
        run: python -m pytest -q
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Build application
        run: python scripts/build.py
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Voxen-${{ matrix.os }}
          path: |
            dist/installer/*.exe
            dist/Voxen-windows.zip
            dist/Voxen-macos.dmg
          if-no-files-found: error

  release:
    name: Attach installers to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: Voxen-*
          path: release-assets
          merge-multiple: true
      - name: Upload installers to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Voxen ${GITHUB_REF_NAME}" \
            --generate-notes || true
          while IFS= read -r -d '' asset; do
            gh release upload "${GITHUB_REF_NAME}" "$asset" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          done < <(find release-assets -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' \) -print0)
