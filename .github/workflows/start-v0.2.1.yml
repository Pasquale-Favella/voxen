name: Start v0.2.1 release
on:
  push:
    branches: [release/v0.2.1]
    paths: ['.github/workflows/start-v0.2.1.yml']
permissions:
  contents: write
  actions: write
jobs:
  release-tag:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: bf1d2c99d34d97f748c278ec1d34ebbef3af610d
      RELEASE_TAG: v0.2.1
    steps:
      - name: Create exact release tag and dispatch canonical build
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$TARGET_SHA"
          if current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha 2>/dev/null); then
            test "$current" = "$TARGET_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$TARGET_SHA"
          fi
          # A tag created with GITHUB_TOKEN does not trigger a push workflow.
          # workflow_dispatch is explicitly supported, including tag refs.
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
